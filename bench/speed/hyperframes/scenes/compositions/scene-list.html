<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #scene-list-root {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #13233a;
          color: #f2f4f8;
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }
        #scene-list-body {
          display: flex;
          flex-direction: column;
          gap: 44px;
          width: 1100px;
        }
        #scene-list-heading {
          font-size: 72px;
          font-weight: 700;
          line-height: 1.15;
        }
        #scene-list-items {
          display: flex;
          flex-direction: column;
          gap: 28px;
          list-style: none;
        }
        #scene-list-items li {
          display: block;
          font-size: 56px;
          font-weight: 500;
          line-height: 1.2;
        }
        #scene-list-items li::before {
          content: "•";
          margin-right: 28px;
        }
      </style>

      <div id="scene-list-root" data-composition-id="scene-list" data-width="1920" data-height="1080">
        <div id="scene-list-body" data-layout-allow-overlap>
          <h2 id="scene-list-heading">What we measure</h2>
          <ul id="scene-list-items">
            <li>Render time</li>
            <li>Tokens</li>
            <li>Success rate</li>
          </ul>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          // 0–0.5 s: crossfade in over the outgoing scene.
          tl.fromTo("#scene-list-root", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
          // Bullets: one at a time, 0.6 s apart from 0.4 s, fading in while rising 20 px.
          tl.fromTo(
            "#scene-list-items li",
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.6 },
            0.4,
          );
          window.__timelines["scene-list"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
