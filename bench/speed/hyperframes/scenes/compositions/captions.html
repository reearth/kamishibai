<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #captions-root {
          position: absolute;
          inset: 0;
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }
        #captions-root .caption {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 120px;
          display: flex;
          justify-content: center;
        }
        #captions-root .caption span {
          display: block;
          max-width: 1536px;
          padding: 12px 28px;
          border-radius: 8px;
          background: rgba(0, 0, 0, 0.6);
          color: #ffffff;
          font-size: 40px;
          font-weight: 500;
          line-height: 1.3;
          text-align: center;
        }
      </style>

      <div id="captions-root" data-composition-id="captions" data-width="1920" data-height="1080">
        <div id="caption-1" class="caption clip" data-start="0.5" data-duration="3">
          <span>Every frame is rendered from its time.</span>
        </div>
        <div id="caption-2" class="caption clip" data-start="4.5" data-duration="3">
          <span>We measure speed, tokens and success.</span>
        </div>
        <div id="caption-3" class="caption clip" data-start="8.5" data-duration="3">
          <span>Same brief, three tools.</span>
        </div>
      </div>

      <script>
        // Caption groups are timed clips; the framework shows each only inside its window.
        window.__timelines["captions"] = gsap.timeline({ paused: true });
      </script>
    </template>
  </body>
</html>
