<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>3D field with a lower third</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0e14;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #three-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <canvas
        id="three-layer"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        data-track-kind="graphics"
        width="1920"
        height="1080"
      ></canvas>

      <div
        id="lower-third"
        class="clip"
        data-composition-id="lower-third"
        data-composition-src="compositions/lower-third.html"
        data-start="1"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/+esm";

      const WIDTH = 1920;
      const HEIGHT = 1080;
      const DURATION = 6;
      const ORBIT_DEGREES = 30;

      // Seeded PRNG (mulberry32): identical placement on every render.
      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(WIDTH, HEIGHT, false);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#0B0E14");

      const camera = new THREE.PerspectiveCamera(45, WIDTH / HEIGHT, 0.1, 200);
      const target = new THREE.Vector3(0, 0, 0);
      const ORBIT_RADIUS = 48;
      const ORBIT_HEIGHT = 10;
      const ORBIT_START = THREE.MathUtils.degToRad(0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const sun = new THREE.DirectionalLight(0xffffff, 2.4);
      sun.position.set(20, 30, 25);
      scene.add(sun);

      // 500 spheres in a 40 × 20 × 30 box centred on the origin.
      const rand = mulberry32(20261009);
      const geometry = new THREE.SphereGeometry(1, 32, 16);
      for (let i = 0; i < 500; i++) {
        const x = (rand() - 0.5) * 40;
        const y = (rand() - 0.5) * 20;
        const z = (rand() - 0.5) * 30;
        const radius = 0.1 + rand() * 0.2;
        const color = new THREE.Color().setHSL(rand(), 0.6, 0.55, THREE.SRGBColorSpace);
        const mesh = new THREE.Mesh(
          geometry,
          new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1 }),
        );
        mesh.position.set(x, y, z);
        mesh.scale.setScalar(radius);
        scene.add(mesh);
      }

      // Camera orbits the box centre at constant speed: 30° over 6 s.
      function renderAt(time) {
        const t = Math.min(Math.max(time, 0), DURATION);
        const angle = ORBIT_START + THREE.MathUtils.degToRad(ORBIT_DEGREES) * (t / DURATION);
        camera.position.set(
          Math.sin(angle) * ORBIT_RADIUS,
          ORBIT_HEIGHT,
          Math.cos(angle) * ORBIT_RADIUS,
        );
        camera.lookAt(target);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (event) => {
        renderAt(event.detail.time);
      });

      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
