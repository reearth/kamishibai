<!doctype html>
<!-- The link-preview card (og:image), 1200×630. Screenshot this page at that
     size into public/og.png. Same tokens and type as the site (DESIGN.md). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kamishibai — OG card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&family=Geist+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --desk: #e7e5df;
        --paper: #fafaf7;
        --frame-bg: #ffffff;
        --ink: #121212;
        --ink-3: #6e6e69;
        --kaki: #d9662a;
        --sans: "Geist", system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: var(--desk); color: var(--ink); font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        display: flex; align-items: center; justify-content: center;
      }
      /* One sheet of paper on the desk. */
      .sheet {
        width: 1104px; height: 534px; background: var(--paper);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        padding: 56px 56px 52px 64px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .logo { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      .mark { display: inline-block; width: 1.1em; height: 1.1em; margin-right: 0.35em; vertical-align: -0.2em; }
      .main { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
      h1 { margin: 0; font-size: 66px; line-height: 1; font-weight: 800; letter-spacing: -0.05em; }
      h1 span { display: block; white-space: nowrap; }
      .url { margin-top: 30px; font-family: var(--mono); font-size: 20px; color: var(--ink-3); }
      /* A 4:3 picture frame, the ball resting on its floor, as on the top page. */
      .frame { position: relative; flex: none; height: 252px; aspect-ratio: 4 / 3; background: var(--frame-bg); border: 1px solid var(--ink); overflow: hidden; }
      .floor { position: absolute; left: 0; right: 0; top: 84%; height: 1px; background: var(--ink); }
      .ball { position: absolute; width: 11%; aspect-ratio: 1; border-radius: 50%; background: var(--kaki); left: 58%; bottom: 16%; }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="logo">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#121212" />
          <rect x="4" y="7" width="24" height="18" fill="#fafaf7" />
          <rect x="4" y="21" width="24" height="1.5" fill="#121212" />
          <circle cx="16" cy="16.5" r="4.5" fill="#d9662a" />
        </svg>kamishibai
      </div>
      <div class="main">
        <div>
          <h1><span>If your agent can</span> <span>write a web page,</span> <span>it can make a video.</span></h1>
          <div class="url">reearth.github.io/kamishibai</div>
        </div>
        <div class="frame" aria-hidden="true">
          <span class="floor"></span>
          <span class="ball"></span>
        </div>
      </div>
    </div>
  </body>
</html>
