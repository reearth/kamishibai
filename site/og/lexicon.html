<!doctype html>
<!-- The Lexicon's link-preview card (og:image), 1200×630. Screenshot this page
     at that size into public/og-lexicon.png. Same tokens and type as the site
     (DESIGN.md). The pictures in stills/ are stills of Lexicon loops. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kamishibai — Lexicon OG card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&family=Geist+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --desk: #e7e5df;
        --paper: #fafaf7;
        --ink: #121212;
        --ink-2: #3e3e3a;
        --ink-3: #6e6e69;
        --sans: "Geist", system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: var(--desk); color: var(--ink); font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        display: flex; align-items: center; justify-content: center;
      }
      /* One sheet of paper on the desk, as in og.html. */
      .sheet {
        width: 1104px; height: 534px; background: var(--paper);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        padding: 56px 56px 52px 64px;
        display: flex; justify-content: space-between; gap: 40px;
      }
      .side { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
      .logo { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
      .logo small { font-size: 22px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; margin-left: 0.4em; }
      .mark { display: inline-block; width: 1.1em; height: 1.1em; margin-right: 0.35em; vertical-align: -0.2em; }
      h1 { margin: 0; font-size: 82px; line-height: 0.98; font-weight: 800; letter-spacing: -0.05em; }
      h1 span { display: block; white-space: nowrap; }
      .lead { margin: 22px 0 0; font-size: 22px; line-height: 1.4; color: var(--ink-2); }
      .url { margin-top: 26px; font-family: var(--mono); font-size: 18px; color: var(--ink-3); }
      /* Six terms as on the Lexicon grid: a 4:3 frame and the name under it. */
      .terms { flex: none; align-self: center; display: grid; grid-template-columns: repeat(3, 168px); gap: 18px 14px; }
      .term { margin: 0; }
      .term img { display: block; width: 168px; height: 126px; border: 1px solid var(--ink); }
      .term figcaption { margin-top: 7px; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="side">
        <div class="logo">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="#121212" />
            <rect x="4" y="7" width="24" height="18" fill="#fafaf7" />
            <rect x="4" y="21" width="24" height="1.5" fill="#121212" />
            <circle cx="16" cy="16.5" r="4.5" fill="#d9662a" />
          </svg>kamishibai<small>/ Lexicon</small>
        </div>
        <div>
          <h1><span>A lexicon</span> <span>of motion.</span></h1>
          <p class="lead">Each term with a loop, and words to hand to an agent.</p>
          <div class="url">reearth.github.io/kamishibai/lexicon</div>
        </div>
      </div>
      <div class="terms">
        <figure class="term"><img src="stills/marquee.png" alt="" /><figcaption>Marquee</figcaption></figure>
        <figure class="term"><img src="stills/lens-flare.png" alt="" /><figcaption>Lens flare</figcaption></figure>
        <figure class="term"><img src="stills/dutch-angle.png" alt="" /><figcaption>Dutch angle</figcaption></figure>
        <figure class="term"><img src="stills/time-lapse.png" alt="" /><figcaption>Time-lapse</figcaption></figure>
        <figure class="term"><img src="stills/orbit.png" alt="" /><figcaption>Orbit</figcaption></figure>
        <figure class="term"><img src="stills/halftone.png" alt="" /><figcaption>Halftone</figcaption></figure>
      </div>
    </div>
  </body>
</html>
